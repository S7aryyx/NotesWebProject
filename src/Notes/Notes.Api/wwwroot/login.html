<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <a class="auth-brand" href="/login.html"><span class="auth-brand-icon">N</span><span>Notes</span></a>
            <p class="auth-eyebrow">ВАШЕ ПРОСТРАНСТВО</p>
            <h1>С возвращением</h1>
            <p class="auth-description">Войдите, чтобы продолжить работу с заметками.</p>
            <form id="login-form" class="auth-form">
                <label for="login_login">Логин</label>
                <input id="login_login" type="text" placeholder="Введите логин" autocomplete="username" required>
                <label for="login_password">Пароль</label>
                <input id="login_password" type="password" placeholder="Введите пароль" autocomplete="current-password" required>
                <button type="submit" class="auth-submit">Войти <i class="bi bi-arrow-right"></i></button>
            </form>
            <div id="login_result" class="auth-result" aria-live="polite"></div>
            <p class="auth-switch">Впервые в Notes? <a href="/register.html">Создать аккаунт</a></p>
        </section>
        <p class="auth-footer">Notes · Ваши идеи в одном месте</p>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
