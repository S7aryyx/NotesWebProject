<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes — Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <a class="auth-brand" href="/login.html"><span class="auth-brand-icon">N</span><span>Notes</span></a>
            <p class="auth-eyebrow">НАЧНИТЕ СЕГОДНЯ</p>
            <h1>Создать аккаунт</h1>
            <p class="auth-description">Соберите заметки, планы и идеи в одном пространстве.</p>
            <form id="register-form" class="auth-form">
                <label for="register_email">Email</label>
                <input id="register_email" type="email" placeholder="name@example.com" autocomplete="email" required>
                <label for="register_login">Логин</label>
                <input id="register_login" type="text" placeholder="Придумайте логин" autocomplete="username" required>
                <label for="register_password">Пароль</label>
                <input id="register_password" type="password" placeholder="Не менее 8 символов" autocomplete="new-password" minlength="8" required>
                <button type="submit" class="auth-submit">Зарегистрироваться <i class="bi bi-arrow-right"></i></button>
            </form>
            <div id="register_result" class="auth-result" aria-live="polite"></div>
            <p class="auth-switch">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
        </section>
        <p class="auth-footer">Notes · Ваши идеи в одном месте</p>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
