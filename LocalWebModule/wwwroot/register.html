<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notes — Регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="auth-page">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-5 col-lg-4">

                <div class="card shadow-sm auth-card">

                    <div class="card-body">

                        <h1 class="text-center mb-2">
                            Notes
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Создание аккаунта
                        </p>


                        <form id="register-form">

                            <div class="mb-3">

                                <label for="register_email"
                                       class="form-label">
                                    Email
                                </label>

                                <input id="register_email"
                                       type="email"
                                       class="form-control"
                                       placeholder="Введите email"
                                       autocomplete="email"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="register_login"
                                       class="form-label">
                                    Логин
                                </label>

                                <input id="register_login"
                                       type="text"
                                       class="form-control"
                                       placeholder="Введите логин"
                                       autocomplete="username"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="register_password"
                                       class="form-label">
                                    Пароль
                                </label>

                                <input id="register_password"
                                       type="password"
                                       class="form-control"
                                       placeholder="Введите пароль"
                                       autocomplete="new-password"
                                       required>
                            </div>
                            <button type="submit"class="btn btn-dark w-100">Зарегистрироваться</button>

                        </form>
                        <div id="register_result"class="mt-3"></div>
                        <div class="text-center mt-4">
                            <span class="text-muted">Уже есть аккаунт?</span>
                            <a href="/login.html">Войти</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
