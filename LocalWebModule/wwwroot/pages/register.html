<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTES — Регистрация</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="auth-page"> <section class="auth-card"> <div class="logo"> NOTES </div> <h1>Создать аккаунт</h1> <p class="auth-description"> Создайте аккаунт, чтобы начать работать с заметками. </p> <form id="registerForm"> <label for="email"> Email </label> <input type="email" id="email" placeholder="example@mail.com" required> <label for="login"> Логин </label> <input type="text" id="login" placeholder="Введите логин" required> <label for="password"> Пароль </label> <input type="password" id="password" placeholder="Введите пароль" required> <button type="submit" class="primary-button"> Зарегистрироваться </button> </form> <p id="registerMessage" class="message"></p> <div class="auth-footer"> Уже есть аккаунт? <a href="/pages/login.html"> Войти </a> </div> </section> </main>
    <script src="/js/auth.js"></script>
</body>
</html>
