<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Notes — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm auth-card">
                    <div class="card-body">
                        <h1 class="text-center mb-2">
                            Notes
                        </h1>
                        <p class="text-center text-muted mb-4">
                            Вход в аккаунт
                        </p>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login_login"
                                       class="form-label">
                                    Логин
                                </label>
                                <input id="login_login"
                                       type="text"
                                       class="form-control"
                                       placeholder="Введите логин"
                                       autocomplete="username"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label for="login_password"
                                       class="form-label">
                                    Пароль
                                </label>
                                <input id="login_password"
                                       type="password"
                                       class="form-control"
                                       placeholder="Введите пароль"
                                       autocomplete="current-password"
                                       required>

                            </div>
                            <button type="submit"class="btn btn-dark w-100">Войти</button>
                        </form>
                        <div id="login_result"class="mt-3"></div>
                        <div class="text-center mt-4">
                            <span class="text-muted">Нет аккаунта?</span>
                            <a href="/register.html">Зарегистрироваться</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
