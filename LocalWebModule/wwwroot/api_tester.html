<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notes — API Tester</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <span class="navbar-brand">
                Notes API Tester
            </span>

            <a href="/index.html"
               class="btn btn-outline-light">

                Перейти в приложение

            </a>

        </div>

    </nav>


    <div class="container mt-4">

        <h2>
            Тестирование API
        </h2>

        <p class="text-muted">
            Страница предназначена для разработки и проверки API.
        </p>


        <!-- ================================= -->
        <!-- USERS -->
        <!-- ================================= -->

        <div class="card mb-4">

            <div class="card-header">

                <h4 class="mb-0">
                    Users / Auth
                </h4>

            </div>


            <div class="card-body">

                <div class="row g-2">

                    <div class="col-md-4">

                        <input id="test_login"
                               class="form-control"
                               placeholder="Login">

                    </div>


                    <div class="col-md-4">

                        <input id="test_password"
                               type="password"
                               class="form-control"
                               placeholder="Password">

                    </div>


                    <div class="col-md-4">

                        <button id="test_login_button"
                                class="btn btn-dark">

                            POST Login

                        </button>

                    </div>

                </div>


                <hr>


                <div class="row g-2">

                    <div class="col-md-4">

                        <input id="test_email"
                               type="email"
                               class="form-control"
                               placeholder="Email">

                    </div>


                    <div class="col-md-4">

                        <input id="test_register_login"
                               class="form-control"
                               placeholder="Login">

                    </div>


                    <div class="col-md-4">

                        <input id="test_register_password"
                               type="password"
                               class="form-control"
                               placeholder="Password">

                    </div>

                </div>


                <button id="test_register_button"
                        class="btn btn-success mt-2">

                    POST Register

                </button>


                <hr>


                <div class="row g-2">

                    <div class="col-md-6">

                        <input id="test_user_id"
                               class="form-control"
                               placeholder="User ID">

                    </div>


                    <div class="col-md-6">

                        <button id="get_user_button"
                                class="btn btn-primary">

                            GET User

                        </button>

                    </div>

                </div>


                <button id="get_users_button"
                        class="btn btn-secondary mt-2">

                    GET All Users

                </button>

            </div>

        </div>


        <!-- ================================= -->
        <!-- FOLDERS -->
        <!-- ================================= -->

        <div class="card mb-4">

            <div class="card-header">

                <h4 class="mb-0">
                    Folders
                </h4>

            </div>


            <div class="card-body">

                <div class="row g-2">

                    <div class="col-md-6">

                        <input id="test_folder_owner"
                               class="form-control"
                               placeholder="Owner ID">

                    </div>


                    <div class="col-md-6">

                        <button id="get_owner_folders_button"
                                class="btn btn-primary">

                            GET Owner Folders

                        </button>

                    </div>

                </div>


                <hr>


                <input id="test_folder_title"
                       class="form-control mb-2"
                       placeholder="Folder title">


                <input id="test_parent_folder"
                       class="form-control mb-2"
                       placeholder="Parent Folder ID (optional)">


                <button id="create_folder_test_button"
                        class="btn btn-success">

                    POST Create Folder

                </button>


                <hr>


                <input id="test_folder_id"
                       class="form-control mb-2"
                       placeholder="Folder ID">


                <button id="get_folder_button"
                        class="btn btn-primary">

                    GET Folder

                </button>


                <button id="delete_folder_button"
                        class="btn btn-danger">

                    DELETE Folder

                </button>

            </div>

        </div>


        <!-- ================================= -->
        <!-- NOTES -->
        <!-- ================================= -->

        <div class="card mb-4">

            <div class="card-header">

                <h4 class="mb-0">
                    Notes
                </h4>

            </div>


            <div class="card-body">

                <input id="test_note_owner"
                       class="form-control mb-2"
                       placeholder="Owner ID">


                <button id="get_owner_notes_button"
                        class="btn btn-primary">

                    GET Owner Notes

                </button>


                <hr>


                <input id="test_note_title"
                       class="form-control mb-2"
                       placeholder="Note title">


                <textarea id="test_note_content"
                          class="form-control mb-2"
                          placeholder="Note content">
            </textarea>


                <input id="test_note_folder"
                       class="form-control mb-2"
                       placeholder="Folder ID (optional)">


                <select id="test_note_type"
                        class="form-select mb-2">

                    <option value="text">
                        text
                    </option>

                    <option value="markdown">
                        markdown
                    </option>

                </select>


                <button id="create_note_test_button"
                        class="btn btn-success">

                    POST Create Note

                </button>


                <hr>


                <input id="test_note_id"
                       class="form-control mb-2"
                       placeholder="Note ID">


                <button id="get_note_button"
                        class="btn btn-primary">

                    GET Note

                </button>


                <button id="favorite_note_button"
                        class="btn btn-warning">

                    POST Favorite

                </button>


                <button id="archive_note_button"
                        class="btn btn-secondary">

                    POST Archive

                </button>


                <button id="restore_note_button"
                        class="btn btn-success">

                    POST Restore

                </button>


                <button id="delete_note_button"
                        class="btn btn-danger">

                    DELETE Note

                </button>

            </div>

        </div>


        <!-- RESULT -->

        <div class="card mb-5">

            <div class="card-header">
                Result
            </div>

            <div class="card-body">

                <pre id="api_result"
                     class="mb-0">
            </pre>

            </div>

        </div>

    </div>


    <script src="/js/api.js"></script>
    <script src="/js/api_tester.js"></script>

</body>

</html>
